[tasks.test]
description = "Run plugin parsing and DST logic tests"
run = "/usr/bin/php vancouver_sunrise/test_parser.php"

[tasks.publish]
description = "Package and upload the plugin to the server"
run = """
rsync -avr --delete ./vancouver_sunrise/. l2:/usr/share/tt-rss/www/plugins/vancouver_sunrise/
"""

[tasks.format]
description = "Format JavaScript and CSS files"
run = "mise x npm:prettier -- prettier --write vancouver_sunrise/*.js vancouver_sunrise/*.css"

[tasks.fetch-data]
description = "Fetch sunrise data from NRC Canada and update sunrise.csv"
run = "util/fetch-sunrise-data.sh"

[tools]
node = "20"
